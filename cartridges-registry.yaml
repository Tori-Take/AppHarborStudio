# ============================================================
# AppHarbor Studio カートリッジレジストリ
#
# このファイルが Studio に取り込むカートリッジを定義する。
# `scripts/fetch-cartridges.js` が起動時に GitHub から clone し、
# `cartridges/_installed/<id>/` 配下に配置する。
#
# 編集後は `npm run cart:fetch` で同期、または `npm run dev` 自動実行。
# ============================================================

version: 1

cartridges:
  # ─── ローカル開発中のカートリッジ ──────────────────────
  # _local/patrol-navi は C:\Users\torit\Desktop\Projects\cart-patrol-navi
  # への junction (symlink 相当)。ローカルクローンを直接編集すると Studio に
  # 即反映される（高速イテレーション）。
  # 公式リリース時は commit + push → 配布側は installed モードで取得。
  - id: patrol-navi
    mode: local
    path: _local/patrol-navi
    enabled: true

  # ─── GitHub から fetch するカートリッジ ───────────────
  # 他人のカートリッジを利用する場合や、ローカル開発しない時はこちらを使う:
  #
  # - id: patrol-navi
  #   repo: Tori-Take/cart-patrol-navi
  #   ref: main                # branch / tag / commit SHA
  #   mode: installed          # GitHub から clone (読み取り専用)
  #   enabled: true
